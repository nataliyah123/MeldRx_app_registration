services:
  meldrx-app:
    build: ./meldrx-template-app-patient-viewer-nextjs
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_APP_BASE_URL : "http://localhost:3000"
      NEXT_PUBLIC_MELDRX_CLIENT_ID : "{{MELDRX_CLIENT_ID}}"
      NEXT_PUBLIC_MELDRX_WORKSPACE_URL : "{{MELDRX_WORKSPACE_URL}}"

  github-python-api:
    build: ./github-python-api
    ports:
      - "8000:8000"

  nodejs-api:
    build: ./nodejs-api
    ports:
      - "3001:3001"

  cds-hook:
    build: ./cds-hook
    ports:
      - "3003:3003"

  ngrok:
    image: ngrok/ngrok:latest
    command: http cds-hook:3003
    environment:
      - NGROK_AUTHTOKEN=your-ngrok-token
    ports:
    - "4040:4040"

